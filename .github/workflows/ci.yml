name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-6-0:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_16.app
      - run: swift --version
      - run: swift test --parallel

  latest:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: swift --version
      - run: swift build -Xswiftc -warnings-as-errors
      - run: swift test --parallel

  simulator:
    name: simulator (iOS ${{ matrix.ios }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The first measurement of iOS 15 with Xcode 16.4.
          - ios: "15.5"
            runner: macos-15
            xcode: Xcode_16.4
            device: iPhone 13
            download: true
          - ios: "16.4"
            runner: macos-26
            xcode: Xcode_26.5
            device: iPhone 13
            download: true
          - ios: "26.5"
            runner: macos-26
            xcode: Xcode_26.5
            device: iPhone 17
            download: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/${{ matrix.xcode }}.app
      - name: Download simulator runtime
        if: matrix.download
        run: |
          set -euo pipefail
          # The iOS 16.4 runtime runs as x86_64 under Xcode 26.5.
          sudo softwareupdate --install-rosetta --agree-to-license
          xcodebuild -downloadPlatform iOS -buildVersion "${{ matrix.ios }}"
      - name: Test
        run: |
          set -euo pipefail
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-$(echo "${{ matrix.ios }}" | tr . -)"
          device_type="$(xcrun simctl list devicetypes | sed -nE 's/^${{ matrix.device }} \((com\.apple[^)]*)\)$/\1/p' | sed -n 1p)"
          test -n "$device_type"
          udid="$(xcrun simctl create tarjim-ci "$device_type" "$runtime")"
          xcodebuild test -scheme Tarjim -destination "id=$udid"
