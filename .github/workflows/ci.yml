name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-5-9:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_15.0.1.app
      - run: swift --version
      - run: swift test --parallel

  swift-6:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: swift --version
      - run: swift test --parallel -Xswiftc -swift-version -Xswiftc 6

  simulator:
    name: simulator (iOS ${{ matrix.ios }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # TODO(orchestrator): runner, xcode and device for iOS 15 are still being measured.
          - ios: "15.5"
            runner: macos-26
            xcode: Xcode_26.5
            device: iPhone 13
            download: true
          - ios: "16.4"
            runner: macos-26
            xcode: Xcode_26.5
            device: iPhone 13
            download: true
          - ios: "26.5"
            runner: macos-26
            xcode: Xcode_26.5
            device: iPhone 17
            download: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/${{ matrix.xcode }}.app
      - name: Download simulator runtime
        if: matrix.download
        run: xcodebuild -downloadPlatform iOS -buildVersion "${{ matrix.ios }}"
      - name: Test
        run: |
          set -euo pipefail
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-$(echo "${{ matrix.ios }}" | tr . -)"
          device_type="$(xcrun simctl list devicetypes | grep -F "${{ matrix.device }} (" | head -n1 | sed -E 's/.*\((com\.apple[^)]*)\)$/\1/')"
          udid="$(xcrun simctl create tarjim-ci "$device_type" "$runtime")"
          xcodebuild test -scheme Tarjim -destination "id=$udid"
