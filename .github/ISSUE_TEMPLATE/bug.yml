name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest steps or code that show it. Never paste an API key.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: SDK version, Xcode version, iOS version and device or simulator.
    validations:
      required: true
